<!doctype html>
<html dir="rtl" lang="he-IL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עורך אזורי בניינים</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Assistant",sans-serif;background:#FAFAF8;color:#2A1B16;padding:20px;line-height:1.6}
h1{font-size:1.4rem;margin-bottom:4px}
.hint{color:#6d6259;font-size:.95rem;margin-bottom:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar button{
  font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
  padding:8px 18px;border-radius:5px;border:1px solid #B09754;background:#fff;color:#2A1B16;
}
.toolbar button.active{color:#fff}
#b1.active{background:#e0453a;border-color:#e0453a}
#b2.active{background:#2fa84f;border-color:#2fa84f}
#b3.active{background:#2f6fd6;border-color:#2f6fd6}
#b4.active{background:#c136c1;border-color:#c136c1}
.toolbar .sep{width:1px;height:26px;background:#d8cfc0;margin:0 4px}
.stage{position:relative;max-width:1400px;user-select:none}
.stage img{width:100%;display:block;border-radius:6px}
.stage svg{position:absolute;inset:0;width:100%;height:100%;border-radius:6px}
polygon{fill-opacity:.28;stroke-width:4;cursor:crosshair}
.p1{fill:#e0453a;stroke:#e0453a}.p2{fill:#2fa84f;stroke:#2fa84f}
.p3{fill:#2f6fd6;stroke:#2f6fd6}.p4{fill:#c136c1;stroke:#c136c1}
circle{fill:#fff;stroke-width:5;cursor:grab;r:14px}
circle.c1{stroke:#e0453a}circle.c2{stroke:#2fa84f}circle.c3{stroke:#2f6fd6}circle.c4{stroke:#c136c1}
circle.dim{opacity:.35}
text.lbl{font-family:"Assistant",sans-serif;font-weight:800;font-size:80px;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.5);stroke-width:6px;text-anchor:middle;pointer-events:none}
.out{margin-top:16px;max-width:1400px}
.out textarea{
  width:100%;height:130px;font-family:Consolas,monospace;font-size:13px;direction:ltr;
  border:1px solid #d8cfc0;border-radius:6px;padding:10px;background:#fff;resize:vertical;
}
.out .row{display:flex;gap:10px;margin-top:8px}
.out button{
  font-family:inherit;font-weight:700;cursor:pointer;padding:10px 26px;
  border-radius:5px;border:1px solid #B09754;background:#B09754;color:#fff;font-size:1rem;
}
.out button.secondary{background:#fff;color:#2A1B16}
#copied{color:#2fa84f;font-weight:700;align-self:center;display:none}
</style>
</head>
<body>

<h1>עורך אזורי בניינים - מלאי דירות</h1>
<p class="hint">
  בוחרים בניין למעלה, ואז: <b>גרירת נקודה</b> - מזיזה אותה &nbsp;|&nbsp; <b>לחיצה על התמונה</b> - מוסיפה נקודה לבניין הנבחר &nbsp;|&nbsp; <b>דאבל-קליק על נקודה</b> - מוחקת אותה.
  בסיום לוחצים "העתקת קואורדינטות" ושולחים לי את הטקסט.
</p>

<div class="toolbar">
  <button id="b1" class="active">בניין 1</button>
  <button id="b2">בניין 2</button>
  <button id="b3">בניין 3</button>
  <button id="b4">בניין 4</button>
  <span class="sep"></span>
  <button id="undo">ביטול נקודה אחרונה</button>
  <button id="reset">איפוס לנוכחי</button>
</div>

<div class="stage" id="stage">
  <img id="img" src="/assets/yadot-elad12-web.jpg" alt="">
  <svg id="svg" viewBox="0 0 2400 1350" preserveAspectRatio="none"></svg>
</div>

<div class="out">
  <textarea id="outbox" readonly></textarea>
  <div class="row">
    <button id="copy">העתקת קואורדינטות</button>
    <button id="dl" class="secondary">הורדה כקובץ</button>
    <span id="copied">הועתק!</span>
  </div>
</div>

<script>
(function(){
  var polys = {
    1: [[1510,374],[2038,478],[2198,562],[2182,1006],[1746,1056],[1514,948]],
    2: [[1032,286],[1482,366],[1510,926],[1030,794]],
    3: [[566,122],[1020,216],[1030,794],[634,714]],
    4: [[302,79],[562,120],[634,714],[286,614]]
  };
  var initial = JSON.parse(JSON.stringify(polys));
  var active = 1;
  var svg = document.getElementById('svg');
  var out = document.getElementById('outbox');
  var drag = null;

  function toSvgPoint(evt){
    var r = svg.getBoundingClientRect();
    var cx = (evt.touches ? evt.touches[0].clientX : evt.clientX);
    var cy = (evt.touches ? evt.touches[0].clientY : evt.clientY);
    return [
      Math.round(Math.min(2400, Math.max(0, (cx - r.left) / r.width * 2400))),
      Math.round(Math.min(1350, Math.max(0, (cy - r.top) / r.height * 1350)))
    ];
  }

  function centroid(pts){
    var x=0,y=0; pts.forEach(function(p){x+=p[0];y+=p[1]});
    return [x/pts.length, y/pts.length];
  }

  function render(){
    var html = '';
    [1,2,3,4].forEach(function(b){
      var pts = polys[b];
      if (pts.length >= 3) {
        html += '<polygon class="p'+b+'" data-b="'+b+'" points="'+pts.map(function(p){return p.join(',')}).join(' ')+'"></polygon>';
        var c = centroid(pts);
        html += '<text class="lbl" x="'+c[0]+'" y="'+(c[1]+28)+'">'+b+'</text>';
      }
      pts.forEach(function(p,i){
        html += '<circle class="c'+b+(b===active?'':' dim')+'" data-b="'+b+'" data-i="'+i+'" cx="'+p[0]+'" cy="'+p[1]+'" r="14"></circle>';
      });
    });
    svg.innerHTML = html;
    out.value = [1,2,3,4].map(function(b){
      return 'building '+b+': '+polys[b].map(function(p){return p.join(',')}).join(' ');
    }).join('\n');
  }

  [1,2,3,4].forEach(function(b){
    document.getElementById('b'+b).addEventListener('click', function(){
      active = b;
      [1,2,3,4].forEach(function(x){document.getElementById('b'+x).classList.toggle('active', x===b)});
      render();
    });
  });

  document.getElementById('undo').addEventListener('click', function(){
    if (polys[active].length > 3) { polys[active].pop(); render(); }
  });
  document.getElementById('reset').addEventListener('click', function(){
    polys = JSON.parse(JSON.stringify(initial)); render();
  });

  svg.addEventListener('pointerdown', function(e){
    var t = e.target;
    if (t.tagName === 'circle') {
      drag = { b: +t.dataset.b, i: +t.dataset.i };
      active = drag.b;
      [1,2,3,4].forEach(function(x){document.getElementById('b'+x).classList.toggle('active', x===drag.b)});
      svg.setPointerCapture(e.pointerId);
      e.preventDefault();
    }
  });
  svg.addEventListener('pointermove', function(e){
    if (!drag) return;
    polys[drag.b][drag.i] = toSvgPoint(e);
    render();
  });
  svg.addEventListener('pointerup', function(){ drag = null; });

  svg.addEventListener('click', function(e){
    if (e.target.tagName === 'circle') return;
    if (drag) return;
    // add a point to the active polygon, inserted next to the nearest edge
    var p = toSvgPoint(e);
    var pts = polys[active];
    var best = 0, bestD = Infinity;
    for (var i = 0; i < pts.length; i++) {
      var a = pts[i], b = pts[(i+1)%pts.length];
      var mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
      var d = (p[0]-mx)*(p[0]-mx) + (p[1]-my)*(p[1]-my);
      if (d < bestD) { bestD = d; best = i+1; }
    }
    pts.splice(best, 0, p);
    render();
  });

  svg.addEventListener('dblclick', function(e){
    if (e.target.tagName !== 'circle') return;
    var b = +e.target.dataset.b, i = +e.target.dataset.i;
    if (polys[b].length > 3) { polys[b].splice(i,1); render(); }
  });

  document.getElementById('copy').addEventListener('click', function(){
    out.select();
    try { navigator.clipboard.writeText(out.value); } catch(err) { document.execCommand('copy'); }
    var c = document.getElementById('copied');
    c.style.display = 'inline';
    setTimeout(function(){ c.style.display = 'none'; }, 1800);
  });

  document.getElementById('dl').addEventListener('click', function(){
    var a = document.createElement('a');
    a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(out.value);
    a.download = 'building-polygons.txt';
    a.click();
  });

  render();
})();
</script>

</body>
</html>
