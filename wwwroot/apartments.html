<!doctype html>
<html dir="rtl" lang="he-IL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאי דירות – galnor yadot</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B09754;
  --gold-deep:#af8b44;
  --gold-bright:#C9A43F;
  --espresso:#2A1B16;
  --ink:#080000;
  --paper:#FAFAF8;
  --mist:#F1F1F1;
  --line:rgba(176,151,84,.35);
  --sans:"Assistant", sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
/* the widget injects Bootstrap after these styles — !important keeps the page
   identical to the front page (fonts, colors, no link underlines) */
body{
  font-family:var(--sans) !important;
  background:var(--paper) !important;
  color:var(--espresso) !important;
  line-height:1.7 !important;
  overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none !important}
header.site-header a,header.site-header button,footer a{font-family:var(--sans) !important}
.page-head h1,.page-head small{font-family:var(--sans) !important}

/* ---------- header (same as front page) ---------- */
header.site-header{
  position:fixed;inset-inline:0;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px clamp(16px,4vw,56px);
  background:linear-gradient(to bottom, rgba(250,250,248,.97), rgba(250,250,248,.9));
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  transition:box-shadow .3s;
}
header.site-header.scrolled{box-shadow:0 6px 30px rgba(42,27,22,.08)}
.logos{display:flex;align-items:center;gap:18px}
.logos img{height:40px;width:auto}
.logos .sep{width:1px;height:30px;background:var(--line)}
nav.main-nav{display:flex;gap:clamp(14px,2.5vw,36px);font-weight:600;font-size:.95rem}
nav.main-nav a{position:relative;padding-block:4px;color:var(--espresso)}
nav.main-nav a::after{
  content:"";position:absolute;bottom:0;right:0;height:2px;width:0;
  background:var(--gold);transition:width .35s cubic-bezier(.22,.61,.36,1);
}
nav.main-nav a:hover::after{width:100%}
.nav-cta{
  border:1px solid var(--gold);color:var(--gold-deep);
  padding:8px 22px;font-weight:700;font-size:.9rem;letter-spacing:.02em;
  border-radius:5px;
  transition:background .3s,color .3s;
}
.nav-cta:hover{background:var(--gold);color:#fff}
.burger{display:none;background:none;border:none;cursor:pointer;padding:6px}
.burger span{display:block;width:24px;height:2px;background:var(--espresso);margin:5px 0;transition:.3s}
@media (max-width:767px){
  nav.main-nav{
    position:fixed;top:69px;inset-inline:0;
    flex-direction:column;gap:0;
    background:var(--paper);border-bottom:1px solid var(--line);
    max-height:0;overflow:hidden;transition:max-height .4s ease;
  }
  nav.main-nav.open{max-height:340px}
  nav.main-nav a{padding:15px 24px;border-top:1px solid var(--mist)}
  nav.main-nav a::after{display:none}
  .burger{display:block}
  .nav-cta-wrap{display:none}
}

/* ---------- page ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(18px,4vw,40px)}
main{padding:clamp(110px,15vh,150px) 0 clamp(50px,8vh,80px)}
.page-head{text-align:center;margin-bottom:clamp(26px,4vh,44px)}
.page-head small{
  display:block;font-size:.85rem;font-weight:600;
  letter-spacing:.16em;color:var(--gold-deep);margin-bottom:8px;
}
.page-head h1{font-weight:800;font-size:clamp(1.9rem,3.8vw,2.8rem);line-height:1.15}

/* ---------- widget overrides ---------- */
.jv-realestate-root{--main-color:#b09754 !important}
.jv-realestate-root .lamishtaken{display:none !important}
.jv-realestate-root .free-market{display:none !important}
.jv-realestate-root .apartment-card{border-radius:6px !important}
.jv-realestate-root .apartment-card.sold::before{content:'נמכר' !important}
.jv-realestate-root .display-btn,
.jv-realestate-root .form-select{border-radius:5px !important}
.jv-realestate-root .apartment-card:not(.sold) .apartment-title::after{
  content:'פנויה';display:block;
  font-size:.9rem;font-weight:600;color:#2ecc71;margin-top:2px;
}

/* ---------- footer (same as front page) ---------- */
footer{
  background:var(--mist);color:var(--espresso);
  border-top:1px solid var(--line);
  padding:30px clamp(18px,4vw,40px);
  display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;
  font-size:.9rem;font-weight:300;
}
footer .f-logos{display:flex;align-items:center;gap:16px}
footer .f-logos img{height:34px;width:auto}
footer a{color:var(--gold-deep);font-weight:600}
footer a:hover{text-decoration:underline !important}
@media (max-width:767px){
  footer{flex-direction:column;justify-content:center;text-align:center;gap:14px}
  footer .f-logos{justify-content:center}
}
</style>
</head>
<body>

<header class="site-header" id="hdr">
  <div class="logos">
    <a href="/redesign" aria-label="דף הבית">
      <img src="/assets/galnor-logo.png" alt="קבוצת גלנור">
    </a>
    <span class="sep"></span>
    <img src="/wp-content/uploads/2026/02/6daf0179-1-e1770420567660-300x120.png" alt="קבוצת ידות">
  </div>
  <nav class="main-nav" id="nav">
    <a href="/redesign#about">על הפרויקט</a>
    <a href="/redesign#gallery">גלריה</a>
    <a href="/redesign#why">למה לבחור בשדרה</a>
    <a href="/redesign#companies">על החברות</a>
    <a href="/redesign#inventory">מלאי דירות</a>
  </nav>
  <div class="nav-cta-wrap">
    <a class="nav-cta" href="/apartments.html?view=building&bview_building=1">לתכנית דירה ומחירים</a>
  </div>
  <button class="burger" id="burger" aria-label="פתיחת תפריט" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1><small>השדרה אלעד</small>מלאי דירות</h1>
    </div>
    <script>
    // Drop garbled duplicate-header rows (all "?" — an Excel encoding artifact)
    // from apartment CSVs before the widget parses them.
    (function () {
      var desc = Object.getOwnPropertyDescriptor(XMLHttpRequest.prototype, "responseText");
      var origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        this.__jvUrl = url;
        return origOpen.apply(this, arguments);
      };
      Object.defineProperty(XMLHttpRequest.prototype, "responseText", {
        configurable: true,
        get: function () {
          var text = desc.get.call(this);
          if (this.__jvUrl && /\.csv(\?|$)/i.test(this.__jvUrl) && typeof text === "string") {
            return text.split(/\r?\n/).filter(function (line) {
              return !(/\?/.test(line) && /^[?",\s]+$/.test(line));
            }).join("\n");
          }
          return text;
        }
      });
    })();
    </script>
    <script src="/assets/jetvaults-real-estate.js" data-container="hasdera-elad" data-project="hasdera-elad"></script>
  </div>
</main>

<footer>
  <div class="f-logos">
    <img src="/assets/galnor-logo.png" alt="גלנור">
    <img src="/wp-content/uploads/2026/02/6daf0179-1-e1770420567660-300x120.png" alt="ידות">
  </div>
  <div>השדרה אלעד - פרויקט מגורים מבית גלנור וידות</div>
  <div>Powered by <a href="http://einstein-web.co.il">Einstein-web</a></div>
</footer>

<script>
(function(){
  var hdr=document.getElementById('hdr');
  addEventListener('scroll',function(){hdr.classList.toggle('scrolled',scrollY>10)},{passive:true});
  var burger=document.getElementById('burger'),nav=document.getElementById('nav');
  burger.addEventListener('click',function(){
    var open=nav.classList.toggle('open');
    burger.setAttribute('aria-expanded',open);
  });
})();
</script>

</body>
</html>
